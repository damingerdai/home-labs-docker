services:
  silo:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    container_name: silo
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=12345678
    volumes:
      - silo-data:/data
    command: server /data --console-address :9001
    restart: always

volumes:
  silo-data:
    driver: local
